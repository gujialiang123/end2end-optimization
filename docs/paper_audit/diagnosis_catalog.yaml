# Diagnosis catalog — end2end-optimization repository evidence audit
# Diagnosis strength: D0 hypothesis-only / D1 profile-log-code / D2 +intervention / D3 +intervention+revert/control
# Audit commit: 100ba9f6434c92779fbe7431161f820045cd5c54  branch: main  date: 2026-07-23

diagnoses:
  - diagnosis_id: D01
    initial_symptom: "R_scheduler_tail ttft_p95 = 2282.48 ms (1512% worse than nearest neighbor)"
    issue_status: real_issue
    root_cause_layer: scheduler   # also configuration
    component: "request admission / max-running-requests"
    proposed_mechanism: "admission cap too low -> requests queue -> tail latency explodes (load-shed concurrency)"
    affected_regimes: [R_scheduler_tail, prefill_long]
    unaffected_regimes: [short_in_short_out_control, low-concurrency neighbors]
    supporting_evidence:
      - "experiments/problems_moe/P001/problem.json (symptom)"
      - "experiments/problems_moe/P001/classification.json (concurrency_capped)"
      - "experiments/problems_moe/P001/attempts/attempt_00{1,2,3}/decision.json"
      - "experiments/problems_moe/P001/solution.md (ttft_p95 2282->168.7, +92.6%)"
    counter_evidence: "none; neighbors small-change, controls no-regression"
    missing_evidence: "explicit revert arm (set cap back to default, confirm symptom returns)"
    recommended_intervention: "raise max-running-requests to 64 (also 96/128 equivalent)"
    intervention_executed: true
    intervention_result: "ttft_p95 2282.48 -> 168.68 ms (+92.6%), also_solved prefill_long +79.7%"
    reverted: false
    neighbor_control: "target + neighbors(con16/con32) + control(short_in_short_out) all present"
    diagnosis_strength: D2  # D3 if revert arm added
    confidence: high
    manual_validation: "P2 in queue: cap=32 vs 64 + revert; pass if cap64 -%90 and revert restores ~2282"
    paper_value: "STRONGEST causal-chain incident; admission-capacity mismatch; config-agent intervention + neighbors/controls"

  - diagnosis_id: D02
    initial_symptom: "autotuning reports '5-9x' speedup on Qwen3-30B-A3B"
    issue_status: measurement_artifact
    root_cause_layer: measurement
    component: "baseline definition (cudagraph enablement)"
    proposed_mechanism: "the '5-9x' baseline was measured with CUDA graph OFF; the framework default runs CUDA graph ON. Comparing tuned(cg-on) to a crippled(cg-off) baseline manufactures a fake speedup."
    affected_regimes: [R_short_decode, R_medium_balanced, R_long_prefill, R_concurrent_decode]
    unaffected_regimes: []
    supporting_evidence:
      - "docs/2026-06-25/autotuning_honest_results.md:85-103 (3-baseline table)"
      - "results/2026-06-25_autotuning/cross_regime_matrix.json"
      - "conflict with docs/2026-06-11/harness_v1_4way_findings.md headline"
    counter_evidence: "vs real default (cg-on), Optuna best is only 0.95-1.05x (within 1-2% noise); R_concurrent best is SLOWER"
    missing_evidence: "a clean single-variable cg-on vs cg-off A/B on identical config, n>=5"
    recommended_intervention: "re-measure with framework-actual default (cudagraph on) as baseline"
    intervention_executed: true
    intervention_result: "speedup collapses to 0.95-1.05x (noise)"
    reverted: n/a
    neighbor_control: "all 4 regimes compared under both baselines"
    diagnosis_strength: D2
    confidence: high
    manual_validation: "P1 in queue: cg-on vs cg-off same config n>=5; pass if cg-off >5x slower p<0.01"
    paper_value: "CORNERSTONE false-positive-rejection case; wrong baseline manufactures speedup"

  - diagnosis_id: D03
    initial_symptom: "custom M=1 MoE kernel isolated 1.23x, expected e2e win"
    issue_status: real_issue   # real but tiny; original overclaim was artifact
    root_cause_layer: gpu_kernel
    component: "fused_experts / MoE decode path"
    proposed_mechanism: "MoE is only ~41% of decode step and step is memory-bound; cudagraph hides launch savings; so isolated kernel speedup does not scale to e2e"
    affected_regimes: [decode b1]
    unaffected_regimes: [decode b2, b4 - regression]
    supporting_evidence:
      - "results/2026-07-20_v41_noise/summary.json (b1 +1.17% t=6.51)"
      - "docs/2026-07-20/noise_verification_custom_moe_b1.md"
      - "results/2026-07-20_v33_decode_audit (MoE 41% of decode)"
    counter_evidence: "b2 -4.29% (t=3.17), b4 -11.74% (t=9.92) real regressions"
    missing_evidence: "more kernel classes (attn/dense) to generalize"
    recommended_intervention: "plug custom kernel into sglang decode, run n=15 interleaved A/B + Welch t"
    intervention_executed: true
    intervention_result: "b1 +1.17% real but tiny; b>=2 net negative"
    reverted: false
    neighbor_control: "b1/b2/b4 batch sweep serve as controls"
    diagnosis_strength: D2
    confidence: high
    manual_validation: "P4 in queue: repeat on 1-2 more kernel types"
    paper_value: "micro->e2e non-transfer, t-tested; paired micro(1.23x)+e2e(1.17%)"

