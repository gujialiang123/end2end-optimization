    neighbor_control: "8 regimes + agent trace span the spectrum"
    diagnosis_strength: D2
    confidence: high
    manual_validation: "sufficient; optional cross-model"
    paper_value: "bottleneck-shift; reconciles apparent contradiction (nsys prefill vs our decode-bound)"

