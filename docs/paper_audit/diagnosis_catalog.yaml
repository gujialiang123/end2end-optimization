  - diagnosis_id: D09
    initial_symptom: "each new image resolution incurs ~70ms extra TTFT stall (VLM)"
    issue_status: real_issue
    root_cause_layer: runtime_jit_cache
    component: "FLA l2norm Triton kernel (T: tl.constexpr)"
    proposed_mechanism: "T as tl.constexpr specializes the kernel per token-count -> N distinct cubins compiled; each new resolution triggers a fresh Triton compile stall"
    affected_regimes: [VLM cold-start, dynamic resolution]
    unaffected_regimes: [fixed resolution, warm cache]
    supporting_evidence:
      - "results/2026-07-21_v46_l2norm_recompile/microbench.jsonl (baseline 10 compiled, patched 0)"
      - "results/2026-07-21_v47_pr31558_server/server_ab_coldcache.jsonl (TTFT 4.005->3.454s, -13.7%, t=20.9)"
      - "patches/pr31558_upstream_42a058c.patch"
    counter_evidence: "fixed single-shape control ~0; warm Triton cache hides effect"
    missing_evidence: "more resolutions + explicit revert (restore constexpr)"
    recommended_intervention: "do_not_specialize=['T'] (upstream PR #31558)"
    intervention_executed: true
    intervention_result: "cold first-pass TTFT -13.7%; per-resolution stall avoided"
    reverted: "control arm = stock l2norm.py (constexpr) is effectively the revert"
    neighbor_control: "cold vs warm cache; fixed vs varying resolution"
    diagnosis_strength: D3
    confidence: high
    manual_validation: "P3 in queue: >=8 resolutions cold, pass if cold -10% p<0.01 and fixed ~0"
    paper_value: "cold-start/JIT-cache confound requires cache-controlled A/B; upstream PR"

