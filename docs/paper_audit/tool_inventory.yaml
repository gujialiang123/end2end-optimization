# Tool / script / skill inventory — end2end-optimization
# Audit commit: 100ba9f6434c92779fbe7431161f820045cd5c54  date: 2026-07-23
# status: implemented_and_used | implemented_not_used | partially_implemented |
#         documentation_only | deprecated | duplicate_or_overlapping | unclear

core_harness:
  - name: run_bench
    path: harness/run_bench.py
    function: "deterministic end-to-end bench harness: spec -> launch server -> bench -> quality gate -> schema-v1 summary.json"
    inputs: [bench-spec yaml, out-dir, optional MFU args]
    outputs: [summary.json, server.log, per_run/*]
    side_effects: "launches/kills server, writes files"
    caller: [harness/autotune*.py, users]
    typed_tool_candidate: true
    decision_maker: deterministic
    status: implemented_and_used
  - name: spec
    path: harness/spec.py
    function: "load/validate bench spec + compute spec_hash (excludes prose)"
    inputs: [spec yaml, base config, regimes]
    outputs: [resolved config, spec_hash]
    caller: [run_bench, autotune]
    typed_tool_candidate: true
    decision_maker: deterministic
    status: implemented_and_used
  - name: executor
    path: harness/executor.py
    function: "shell out to e2e-bench-runner skill; return bench_summary.json"
    caller: [run_bench]
    typed_tool_candidate: true
    decision_maker: deterministic
    status: implemented_and_used
  - name: lifecycle
    path: harness/lifecycle.py
    function: "server process-group launch/kill, health wait"
    side_effects: "starts/kills server"
    typed_tool_candidate: true
    status: implemented_and_used
  - name: quality
    path: harness/quality.py
    function: "reliability/sanity gate on per_run metrics"
    typed_tool_candidate: true
    status: implemented_and_used
  - name: output
    path: harness/output.py
    function: "schema v1 writer/validator for summary.json"
    typed_tool_candidate: true
    status: implemented_and_used
  - name: env_snapshot
    path: harness/env_snapshot.py
    function: "capture env (nvidia-smi/nvcc/git)"
    side_effects: "shell probes"
    typed_tool_candidate: true
    status: implemented_and_used
  - name: mfu
    path: harness/mfu.py
    function: "MFU/MBU postprocessing"
    typed_tool_candidate: true
    status: partially_implemented

autotuning:
  - name: autotune_v1
    path: harness/autotune.py
    function: "Optuna v1 framework tuning"
    outputs: [study.db, best.json, trial dirs]
    decision_maker: "Optuna TPE (not LLM)"
    status: implemented_and_used
  - name: autotune_v2_lfm
    path: harness/autotune_v2_lfm.py
    function: "conditional search-space tuning"
    status: implemented_and_used
    note: "v2 conditional search underperformed (see 2026-06-30)"
  - name: autotune_v3_lfm
    path: harness/autotune_v3_lfm.py
    function: "warm-start + MFU annotation tuning"
    status: implemented_and_used
    note: "warm-start biased convergence; superseded by clean v48 study (run_v48_lfm25_plateau.py)"

solver:
  - name: config_agent
    path: scripts/solver/config_agent.py
    function: "Stage B single-knob solver: sweep one knob, verify target+neighbors+controls, write decision.json + solution.md"
    inputs: [problem package]
    outputs: [attempts/*/candidate_config.yaml, decision.json, solution.md]
    side_effects: "launches/kills server"
    decision_maker: "RULE-BASED fixed loop (NOT an LLM)"
    typed_tool_candidate: true
    status: implemented_and_used
    note: "IMPORTANT for honest attribution: this is a rule-based sweep, not an LLM agent"
  - name: other_solvers
    path: "stages/problem-solver/README.md (scheduler/kernel/workload-shape)"
    status: documentation_only
    note: "only config-agent is implemented"

stage1_reusable:
