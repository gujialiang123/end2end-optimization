  - {name: cluster_regimes, path: scripts/cluster_regimes.py, function: "cluster/map regimes", status: implemented_and_used}
  - {name: select_cases_for_stage2, path: scripts/select_cases_for_stage2.py, function: "freeze selected cases into problem packages", status: implemented_and_used}
