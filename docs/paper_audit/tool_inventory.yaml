  - {name: llm_agent_triage, path: stages/problem-setter/policies/llm_agent.md, function: "LLM decides which workload to expand / axis / when to stop", decision_maker: LLM, status: partially_implemented, note: "ONLY genuine LLM decision point in repo; NO landed run-trace found -> weak attribution evidence"}

